name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: support_test
          POSTGRES_USER: support_test
          POSTGRES_PASSWORD: support_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U support_test -d support_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://support_test:support_test@localhost:5433/support_test
      TEST_DATABASE_URL: postgresql+psycopg://support_test:support_test@localhost:5433/support_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        run: alembic upgrade head

      - name: Run fast tests
        run: pytest -q -m "not integration"

      - name: Run PostgreSQL integration tests
        run: pytest -q -m integration

      - name: Run coverage
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=75
