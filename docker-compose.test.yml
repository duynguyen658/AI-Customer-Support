services:
  db_test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_TEST_DB:-support_test}
      POSTGRES_USER: ${POSTGRES_TEST_USER:-support_test}
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:-support_test}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

